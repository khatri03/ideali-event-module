<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ideali Events — Reporting Prototype</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
</head>
<body>
<div class="app">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">Ie</div>
      <div>
        <div class="name">Ideali Events</div>
        <div class="sub">Organizer console</div>
      </div>
    </div>

    <div class="nav-group-label">Overview</div>
    <a class="nav-link" data-nav="dashboard" href="#/dashboard"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <a class="nav-link" data-nav="events" href="#/events"><i class="bi bi-calendar-event"></i> Events</a>
    <a class="nav-link" data-nav="sessions" href="#/sessions"><i class="bi bi-calendar3"></i> Sessions</a>

    <div class="nav-group-label">Reports</div>
    <a class="nav-link" data-nav="sales" href="#/reports/sales"><i class="bi bi-cash-stack"></i> Sales &amp; Revenue</a>
    <a class="nav-link" data-nav="orders" href="#/reports/orders"><i class="bi bi-receipt"></i> All Invoices</a>
    <a class="nav-link" data-nav="unpaid" href="#/reports/unpaid"><i class="bi bi-hourglass-split"></i> Unpaid Invoices</a>
    <a class="nav-link" data-nav="attendance" href="#/reports/attendance"><i class="bi bi-person-check"></i> Attendance &amp; Check-in</a>
    <a class="nav-link" data-nav="sellthrough" href="#/reports/sellthrough"><i class="bi bi-bar-chart-line"></i> Sell-through</a>
    <a class="nav-link" data-nav="refunds" href="#/reports/refunds"><i class="bi bi-arrow-counterclockwise"></i> Refunds</a>
    <a class="nav-link" data-nav="coupons" href="#/reports/coupons"><i class="bi bi-ticket-perforated"></i> Coupon Usage</a>

    <div class="nav-group-label">Finance</div>
    <a class="nav-link" data-nav="payouts" href="#/payouts"><i class="bi bi-bank"></i> Payouts</a>
    <a class="nav-link" data-nav="attendees" href="#/attendees"><i class="bi bi-people"></i> Attendees</a>

    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar">SA</div>
        <div>
          <div style="font-size:13.5px;font-weight:600;">Sohail Ahmed</div>
          <div style="font-size:11.5px;color:var(--muted);">Organizer</div>
        </div>
        <i class="bi bi-three-dots" style="margin-left:auto;color:var(--muted);"></i>
      </div>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <!-- ================= MAIN ================= -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger"><i class="bi bi-list" style="font-size:20px;"></i></button>
      <div>
        <h1 id="viewTitle">Dashboard</h1>
        <p class="sub" id="viewSub">Performance across your events</p>
      </div>
      <div class="topbar-actions">
        <select class="form-select-x" id="eventPicker" aria-label="Filter by event">
          <option value="all">All events</option>
        </select>
        <select class="form-select-x" id="rangePicker" aria-label="Date range">
          <option>Last 7 days</option>
          <option selected>Last 30 days</option>
          <option>This quarter</option>
          <option>Year to date</option>
        </select>
        <button class="btn-ghost" id="exportBtn"><i class="bi bi-download"></i> Export</button>
      </div>
    </header>

    <main class="content" id="viewHost"></main>
  </div>
</div>

<div class="toast-host" id="toastHost"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
