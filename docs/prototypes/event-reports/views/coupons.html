<div class="mb-3 d-flex align-items-center gap-2 flex-wrap" data-context></div>

<div class="card-x run-primed" data-primed hidden>
  <div class="ic"><i class="bi bi-play-circle"></i></div>
  <h3>Coupon usage ready</h3>
  <p>Pick an event above to auto-run it, or run across all events now.</p>
  <button class="btn-brand" data-run><i class="bi bi-play-fill"></i> Run report</button>
</div>

<div data-results>
  <div class="row g-3 mb-3">
    <div class="col-6 col-lg-4"><div class="card-x kpi"><div class="label">Codes redeemed</div><div class="value" id="cpRedeemed">—</div><div class="delta up"><i class="bi bi-arrow-up-right"></i> attributed</div></div></div>
    <div class="col-6 col-lg-4"><div class="card-x kpi"><div class="label">Discount given</div><div class="value" id="cpRevenue">—</div><div class="delta muted">revenue driven</div></div></div>
    <div class="col-6 col-lg-4"><div class="card-x kpi"><div class="label">Active codes</div><div class="value" id="cpActive">—</div><div class="delta muted">in use</div></div></div>
  </div>
  <div class="row g-3 mb-3">
    <div class="col-12 col-xl-6"><div class="card-x panel">
      <div class="panel-head"><div><h2>Redemptions by code</h2><div class="sub">Top performers</div></div></div>
      <div class="chart-wrap" style="height:270px;"><canvas id="chartCoupon"></canvas></div>
    </div></div>
    <div class="col-12 col-xl-6"><div class="card-x panel">
      <div class="panel-head"><div><h2>Code performance</h2><div class="sub">Redemptions, revenue, discount</div></div></div>
      <div class="table-responsive"><table class="table-x"><thead><tr>
        <th>Code</th><th>Type</th><th class="th-num">Redeemed</th><th class="th-num">Revenue</th><th class="th-num">Discount</th><th>Status</th>
      </tr></thead><tbody id="couponsBody"></tbody></table></div>
    </div></div>
  </div>
</div>
